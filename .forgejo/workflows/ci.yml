name: CI
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh check-and-rebuild.sh

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S contents/lib -B build -DCMAKE_BUILD_TYPE=Release -DPROXMON_BUILD_TESTS=ON
      - run: cmake --build build -- -j$(nproc)
      - run: test -f build/libproxmoxclientplugin.so
      # The QML tests are registered only if CMake located qmltestrunner.
      # Without this check a missing runner drops them silently.
      - name: Verify the QML tests are registered
        run: |
          ctest --test-dir build -N
          for qml_test in configportability refreshdebounce; do
            ctest --test-dir build -N | grep -q "$qml_test" || {
              echo "$qml_test is not registered: qmltestrunner missing from the CI image"
              exit 1
            }
          done
      - run: ctest --test-dir build --output-on-failure
