name: CI
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh check-and-rebuild.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, fedora-44, manjaro]
    runs-on: ${{ matrix.os }}
    env:
      # One cache folder per image, on a volume the runner mounts at /ccache so
      # it survives between jobs. Without that volume ccache starts empty.
      CCACHE_DIR: /ccache/${{ matrix.os }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          # CMake reads these at the first configure. Use ccache only where the
          # image has it, so an image without it still builds.
          if command -v ccache >/dev/null 2>&1; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ccache --zero-stats
          fi
          cmake -S contents/lib -B build -DCMAKE_BUILD_TYPE=Release -DPROXMON_BUILD_TESTS=ON
      - run: cmake --build build -- -j$(nproc)
      - run: test -f build/libproxmoxclientplugin.so
      # The QML tests are registered only if CMake located qmltestrunner.
      # Without this check a missing runner drops them silently.
      - name: Verify the QML tests are registered
        run: |
          # Read the list once, then search it. Piping ctest into grep -q fails
          # under pipefail: grep exits at the first match and ctest dies of SIGPIPE.
          registered=$(ctest --test-dir build -N)
          echo "$registered"
          for qml_test in configportability refreshdebounce; do
            grep -q "$qml_test" <<< "$registered" || {
              echo "$qml_test is not registered: qmltestrunner missing from the CI image"
              exit 1
            }
          done
      # The Secret Service test hosts a fake provider on a private bus and skips
      # itself when dbus-daemon is missing. Install it when the image lacks it,
      # and fail if it is still missing, so a skipped test cannot pass unnoticed.
      # Bake dbus-daemon into the images to make this a no-op.
      - name: Ensure dbus-daemon is available
        run: |
          if ! command -v dbus-daemon >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y dbus-daemon
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y dbus-daemon
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm dbus
            fi
          fi
          command -v dbus-daemon || {
            echo "dbus-daemon is missing from the CI image and could not be installed, so the secretservice test would be skipped"
            exit 1
          }
      - run: ctest --test-dir build --output-on-failure
      # Hit and miss counts show whether the cache volume is working: after the
      # first run on an image, most compiles should be hits.
      - name: ccache statistics
        if: always()
        run: command -v ccache >/dev/null 2>&1 && ccache --show-stats || echo "ccache is not installed in this image"
