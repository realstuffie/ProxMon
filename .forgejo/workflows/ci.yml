name: CI
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh make-dist.sh check-and-rebuild.sh check-style.sh check-config-pages.sh

  style:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      # Tabs, trailing whitespace and indentation steps. The rules live in
      # .editorconfig and are explained in docs/developer-notes.md.
      - run: bash check-style.sh
      # Every settings page must declare every setting in main.xml.
      - run: bash check-config-pages.sh

  # Distro packages link the system QtKeychain. Ubuntu 26.04 ships 0.15.0, which
  # cannot choose a backend, so this job covers the build where the KeePassXC
  # option is off and the Keyring tab is hidden. It needs no submodule checkout,
  # because that build never touches third_party/qtkeychain.
  system-qtkeychain:
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: /ccache/system-qtkeychain
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the QtKeychain development package is available
        run: |
          if ! dpkg -s qtkeychain-qt6-dev >/dev/null 2>&1; then
            apt-get update && apt-get install -y qtkeychain-qt6-dev
          fi
          dpkg -s qtkeychain-qt6-dev | grep '^Version'
      - name: Configure
        run: |
          if command -v ccache >/dev/null 2>&1; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ccache --zero-stats
          fi
          cmake -S contents/lib -B build -DCMAKE_BUILD_TYPE=Release -DPROXMON_BUILD_TESTS=ON -DPROXMON_SYSTEM_QTKEYCHAIN=ON
      - run: cmake --build build -- -j$(nproc)
      - run: ctest --test-dir build --output-on-failure
      - name: ccache statistics
        if: always()
        run: command -v ccache >/dev/null 2>&1 && ccache --show-stats || echo "ccache is not installed in this image"

  # Test-builds the Ubuntu package the way a PPA upload is prepared: the release
  # tarball from make-dist.sh becomes the orig tarball, then dpkg-buildpackage
  # makes the source package and the .deb. Nothing is signed or uploaded, and the
  # build directory is removed at the end. Signing and dput stay local. The
  # image is built from .forgejo/images/Dockerfile.packaging and already holds
  # the tools and build dependencies, so the install step below is a safety net.
  package:
    runs-on: ubuntu-26.04-packaging
    env:
      PKG_DIR: /tmp/proxmon-package
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the packaging tools and build dependencies
        run: |
          apt-get update
          apt-get install -y dpkg-dev debhelper fakeroot lintian
          apt-get build-dep -y ./
      - name: Build the release tarball and the package
        run: |
          bash make-dist.sh
          version="$(dpkg-parsechangelog -S Version)"
          upstream="${version%-*}"
          test -f "dist/proxmon-$upstream.tar.gz" || {
            echo "debian/changelog is at $upstream, but make-dist.sh built a different version from metadata.json"
            exit 1
          }
          mkdir -p "$PKG_DIR"
          cp "dist/proxmon-$upstream.tar.gz" "$PKG_DIR/proxmon_$upstream.orig.tar.gz"
          tar -xzf "$PKG_DIR/proxmon_$upstream.orig.tar.gz" -C "$PKG_DIR"
          cd "$PKG_DIR/proxmon-$upstream"
          dpkg-buildpackage -us -uc
      - name: Check the package
        run: |
          cd "$PKG_DIR"
          lintian --fail-on error --display-info ./*.changes
          deb="$(ls ./proxmon_*.deb)"
          contents="$(dpkg -c "$deb")"
          echo "$contents"
          # The plugin, and the link that puts it next to the qmldir.
          grep -q 'usr/lib/.*/proxmon/libproxmoxclientplugin\.so$' <<< "$contents"
          grep -q 'contents/lib/proxmox/libproxmoxclientplugin\.so -> ' <<< "$contents"
          # The bundled QtKeychain is static, so none of it may be installed.
          if grep -qi 'keychain' <<< "$contents"; then
            echo "The package ships QtKeychain files"
            exit 1
          fi
      - name: Remove the build
        if: always()
        run: rm -rf "$PKG_DIR" dist

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, fedora-44, manjaro, opensuse-tumbleweed]
    runs-on: ${{ matrix.os }}
    env:
      # One cache folder per image, on a volume the runner mounts at /ccache so
      # it survives between jobs. Without that volume ccache starts empty.
      CCACHE_DIR: /ccache/${{ matrix.os }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          # CMake reads these at the first configure. Use ccache only where the
          # image has it, so an image without it still builds.
          if command -v ccache >/dev/null 2>&1; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ccache --zero-stats
          fi
          cmake -S contents/lib -B build -DCMAKE_BUILD_TYPE=Release -DPROXMON_BUILD_TESTS=ON
      - run: cmake --build build -- -j$(nproc)
      - run: test -f build/libproxmoxclientplugin.so
      # The QML tests are registered only if CMake located qmltestrunner.
      # Without this check a missing runner drops them silently.
      - name: Verify the QML tests are registered
        run: |
          # Read the list once, then search it. Piping ctest into grep -q fails
          # under pipefail: grep exits at the first match and ctest dies of SIGPIPE.
          registered=$(ctest --test-dir build -N)
          echo "$registered"
          for qml_test in configportability refreshdebounce; do
            grep -q "$qml_test" <<< "$registered" || {
              echo "$qml_test is not registered: qmltestrunner missing from the CI image"
              exit 1
            }
          done
      # The Secret Service test hosts a fake provider on a private bus and skips
      # itself when dbus-daemon is missing. Install it when the image lacks it,
      # and fail if it is still missing, so a skipped test cannot pass unnoticed.
      # Bake dbus-daemon into the images to make this a no-op.
      - name: Ensure dbus-daemon is available
        run: |
          if ! command -v dbus-daemon >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y dbus-daemon
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y dbus-daemon
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm dbus
            elif command -v zypper >/dev/null 2>&1; then
              zypper --non-interactive install dbus-1-daemon
            fi
          fi
          command -v dbus-daemon || {
            echo "dbus-daemon is missing from the CI image and could not be installed, so the secretservice test would be skipped"
            exit 1
          }
      - run: ctest --test-dir build --output-on-failure
      # Runs the installer against the plugin built above, in a throwaway home
      # folder, then the uninstaller. It needs kpackagetool6 in the image.
      - name: Install and uninstall
        run: |
          export HOME="$(mktemp -d)"
          unset XDG_DATA_HOME XDG_CONFIG_HOME XDG_CACHE_HOME
          bash install.sh --ci-build-dir=build
          dir="$HOME/.local/share/plasma/plasmoids/org.kde.plasma.proxmox"
          test -f "$dir/metadata.json"
          test -f "$dir/contents/lib/proxmox/libproxmoxclientplugin.so"
          test -f "$dir/contents/lib/proxmox/qmldir"
          bash uninstall.sh
          test ! -e "$dir"
      # Hit and miss counts show whether the cache volume is working: after the
      # first run on an image, most compiles should be hits.
      - name: ccache statistics
        if: always()
        run: command -v ccache >/dev/null 2>&1 && ccache --show-stats || echo "ccache is not installed in this image"
