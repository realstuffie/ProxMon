name: CI
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh check-and-rebuild.sh

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S contents/lib -B build -DCMAKE_BUILD_TYPE=Release -DPROXMON_BUILD_TESTS=ON
      - run: cmake --build build -- -j$(nproc)
      - run: test -f build/libproxmoxclientplugin.so
      # configportability is registered only if CMake located qmltestrunner.
      # Without this check a missing runner drops the test silently.
      - name: Verify the QML test is registered
        run: |
          ctest --test-dir build -N
          ctest --test-dir build -N | grep -q configportability || {
            echo "configportability is not registered: qmltestrunner missing from the CI image"
            exit 1
          }
      - run: ctest --test-dir build --output-on-failure
