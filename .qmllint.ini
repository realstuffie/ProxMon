[Warnings]
# C++ plugin types (ProxMon.*, KDE types) can't be resolved at lint time
ImportFailure=disable
MissingProperty=disable
UnresolvedType=disable
IncompatibleType=disable

# The plugin import is only used through its C++ types, which the linter can't
# see, so it reports the import itself as unused.
UnusedImports=disable

# property var callbacks are an intentional pattern throughout this codebase
UseProperFunction=disable
